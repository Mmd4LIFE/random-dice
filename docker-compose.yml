services:
  bot:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    # Overrides USE_POLLING from env_file — many .env copies still have USE_POLLING=false; Telegram then never reaches /webhook without HTTPS.
    # For production webhooks: delete the next line (or set USE_POLLING: "false") after TLS + setWebhook are configured.
    environment:
      USE_POLLING: "true"
    restart: unless-stopped
    # Lets POSTGRES_HOST=host.docker.internal reach Postgres on the Docker host (Linux + Compose v2.4+).
    extra_hosts:
      - "host.docker.internal:host-gateway"
