services:
  bot:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    # Defaults to polling when USE_POLLING is unset (Telegram cannot reach /webhook without HTTPS). Override in .env: USE_POLLING=false for webhooks.
    environment:
      USE_POLLING: ${USE_POLLING:-true}
    restart: unless-stopped
    # Lets POSTGRES_HOST=host.docker.internal reach Postgres on the Docker host (Linux + Compose v2.4+).
    extra_hosts:
      - "host.docker.internal:host-gateway"
